# Phonebook — single public URL via Nginx reverse proxy (FastAPI version).
#
#   http://localhost:8081/               -> Vue frontend  (127.0.0.1:5174 in tests,
#                                                          :5173 in normal dev)
#   http://localhost:8081/api/...        -> FastAPI       (127.0.0.1:8000)
#
# Canonical layout (mirrors the Node project on :80/:8080):
#   listen 80 (or 8080) with / -> :5173 and /api/ -> :8000.
# SQL Server is never routed here and stays private on loopback.

events {}

http {
    access_log off;

    upstream phonebook_frontend {
        server 127.0.0.1:5173;
    }

    upstream phonebook_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;

        # Backend JSON API (prefix is preserved: /api/contacts -> backend /api/contacts)
        location /api/ {
            proxy_pass http://phonebook_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vue frontend (websocket headers keep Vite HMR working in dev)
        location / {
            proxy_pass http://phonebook_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
